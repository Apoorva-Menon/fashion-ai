[project]
name = "fashion-ai"
version = "0.1.0"
description = "AI stylist and virtual try-on pipeline combining Google Vision, Gemini Multimodal, and modular skill knowledge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0.0",
    "google-cloud-vision>=3.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
camera = [
    "opencv-python>=4.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
